spring.application.name=casino-dados

# MySQL: crea la base de datos automaticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/casino_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Genera/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
